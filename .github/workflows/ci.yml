# SPDX-License-Identifier: Apache-2.0
# SANKHYA - continuous integration.
#
# ubuntu-latest is the authority on -Werror cleanliness and on the sanitizer runs; the
# Windows build is a developer convenience and is not gated here.
#
# The `provenance` job is not decoration. CLAUDE.md commits us to proving that nothing from
# an optimization solver is linked in, and the cheapest proof is a machine-generated link
# line plus `ldd` on every pull request, so the claim cannot silently rot.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: OFF
          - name: Debug+ASan+UBSan
            build_type: Debug
            sanitize: ON

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Report compiler version
        run: g++ --version

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSANKHYA_SANITIZE=${{ matrix.sanitize }} \
            -DSANKHYA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        env:
          # halt_on_error keeps a sanitizer report from being buried under later output.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

      # Every other check in this job is a unit test. Without this step the command line
      # itself - argument handling, file loading, the writers, the exit codes - is covered
      # by nothing and could break completely while CI stayed green. This runs the pipeline
      # the way a judge will: read a file, solve it, write the outputs, and check the number
      # against a value verified by hand outside the solver.
      - name: CLI end-to-end smoke test
        run: |
          set -euo pipefail
          ./build/sankhya version
          ./build/sankhya options
          ./build/sankhya info demo/crude_blend.mps

          echo '--- solve the MPS form ---'
          ./build/sankhya solve demo/crude_blend.mps --write-sol blend.sol --stats blend.json
          test -s blend.sol
          test -s blend.json

          echo '--- the LP form must give an identical solution ---'
          ./build/sankhya solve demo/crude_blend.lp --write-sol blend_lp.sol
          diff <(sed -n '/begin columns/,/end rows/p' blend.sol) \
               <(sed -n '/begin columns/,/end rows/p' blend_lp.sol)

          echo '--- so must the gzipped MPS ---'
          gzip -kf demo/crude_blend.mps
          ./build/sankhya solve demo/crude_blend.mps.gz --write-sol blend_gz.sol
          diff <(sed -n '/begin columns/,/end rows/p' blend.sol) \
               <(sed -n '/begin columns/,/end rows/p' blend_gz.sol)

          echo '--- objective must match the hand-verified value ---'
          python3 tools/check_demo_result.py blend.json

          echo '--- the solution must survive INDEPENDENT verification ---'
          # verify_solution.py shares no code with the solver: it re-parses the model
          # with its own MPS reader and re-derives feasibility, the objective and
          # strong duality. A reader bug shows up here as a disagreement.
          python3 tools/verify_solution.py demo/crude_blend.mps blend.sol

          echo '--- a MILP must be SOLVED, and never answered with its relaxation ---'
          # Before Phase 5 this step asserted the MILP was refused. Branch and bound now
          # solves it, so the assertion moves to what actually matters and always did: the
          # answer must be INTEGRAL. A fractional point reported as optimal is the failure
          # this check exists to catch, whichever engine produced it.
          ./build/sankhya solve demo/blend_milp.mps --write-sol milp.sol --stats milp.json
          grep -q 'branch-and-bound' milp.json
          python3 tools/verify_solution.py demo/blend_milp.mps milp.sol
          echo 'MILP solved and independently verified'

      # The PS26119 case studies. These are the instances the demo is built on, so a
      # regression in any of them turns the demonstration into a wrong answer delivered
      # confidently to a judge. Each optimum below was established OUTSIDE the solver:
      # power_dispatch by exhaustive enumeration, lot_sizing by hand, and supply_chain and
      # ill_conditioned by the fact that the second is an exact re-scaling of the first.
      # numpy is OPTIONAL. matrix_stats.py computes rank exactly over the rationals, which
      # is the load-bearing claim and needs no third party; numpy is used only for the SVD
      # behind the condition number, and the script says so plainly when it is absent.
      - name: numpy, for the condition number only
        run: pip install numpy

      - name: PS26119 case studies
        run: |
          set -euo pipefail

          echo '--- the committed .mps files must still match their generator ---'
          # If they drift, the algebra documented in the file headers no longer describes
          # the instance the demo actually solves.
          python3 data/casestudies/generate.py
          git diff --exit-code -- data/casestudies/

          for case in power_dispatch supply_chain ill_conditioned lot_sizing; do
            echo "--- $case ---"
            ./build/sankhya solve "data/casestudies/$case.mps"               --write-sol "$case.sol" --stats "$case.json"
            python3 tools/verify_solution.py "data/casestudies/$case.mps" "$case.sol" --quiet
          done

          echo '--- the MILP answer must agree with exhaustive enumeration ---'
          # verify_solution.py cannot prove a MILP optimum is unbeatable; only a second,
          # independent search can. Four units means sixteen commitment patterns.
          python3 data/casestudies/dispatch_oracle.py
          python3 - <<'PYEOF'
          import json
          got = json.load(open("power_dispatch.json"))["result"]["objective"]
          assert abs(got - 3270.0) <= 1e-9, f"dispatch optimum moved to {got!r}, oracle says 3270"
          print("dispatch agrees with the oracle")
          PYEOF

          echo '--- scaling must not move the answer ---'
          # ill_conditioned.mps is supply_chain.mps under a diagonal change of variable
          # spanning 22 orders of magnitude. The objective is invariant under that by
          # construction, so any disagreement is a numerical bug in our solver.
          python3 - <<'PYEOF'
          import json
          a = json.load(open("supply_chain.json"))["result"]["objective"]
          b = json.load(open("ill_conditioned.json"))["result"]["objective"]
          assert abs(a - b) <= 1e-9 * max(1.0, abs(a)), f"scaling moved the answer: {a!r} vs {b!r}"
          print(f"both re-scalings agree on {a!r}")
          PYEOF

          echo '--- the demo itself must run start to finish ---'
          # --quick skips the HiGHS comparison, which needs highspy.
          bash demo/run_sih_demo.sh --quick > /dev/null
          echo 'PS26119 demo ran clean'

  benchmarks:
    name: netlib benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build -j

      # data/netlib/ is gitignored, so without a cache this job downloads the whole set
      # from netlib.org on every run. A netlib.org outage then turns the benchmark red for
      # a reason unrelated to the change under review - and over a sprint that trains
      # everyone to ignore a red benchmark job, which is the one job whose failure matters
      # most.
      #
      # Keyed on fetch_data.py itself, because that file decides both WHICH instances are
      # fetched (the --set tiers) and HOW the published optima are parsed out of the
      # readme. Any change to either has to re-fetch; nothing else needs to.
      - name: Cache the fetched Netlib instances
        id: netlib-cache
        uses: actions/cache@v4
        with:
          path: data/netlib
          key: netlib-v1-${{ hashFiles('bench/runners/fetch_data.py') }}

      # Downloads the instances and PARSES the reference optima out of Netlib's own
      # readme. No expected value is stored in this repository, so the benchmark cannot
      # be made to pass by editing a constant.
      #
      # Still runs on a cache hit. It is cheap when the files are already present, it
      # re-verifies every sha256 in reference.json, and it keeps the fetch path on the
      # tested route rather than letting it rot behind a cache that always hits.
      - name: Fetch the Netlib set and its published optima
        run: python3 bench/runners/fetch_data.py

      # Gates on BOTH the published optimum and independent verification of every
      # solution. Exits non-zero if any instance fails either one.
      - name: Solve and verify
        run: python3 bench/runners/netlib.py --binary build/sankhya --time-limit 120

      - name: Upload the evidence CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlib-results
          path: bench/results/*.csv
          if-no-files-found: warn

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Configure and build
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DSANKHYA_BUILD_TESTS=OFF
          cmake --build build -j

      - name: Record the link line and shared library dependencies
        run: |
          echo "=== full link line ==="
          # The link command the build system actually ran. Asked of Ninja directly rather
          # than read out of a file, so it cannot drift from what was really executed.
          ninja -C build -t commands sankhya | tail -1
          echo
          echo "=== ldd build/sankhya ==="
          ldd build/sankhya
          echo
          echo "=== nothing below may name a solver ==="
          if ldd build/sankhya | grep -Ei 'cbc|clp|highs|scip|soplex|glpk|lpsolve|osqp|ortools|gurobi|cplex|xpress'; then
            echo "FAIL: a solver library is linked into the binary"
            exit 1
          fi
          echo "OK: no solver library is linked"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sankhya-sbom.spdx.json

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned via pip rather than apt: clang-format's output changes between major versions,
      # so an unpinned formatter turns a green tree red on an unrelated runner image bump.
      # This is the exact version the tree was normalised with.
      - name: Check formatting
        run: |
          pip install clang-format==22.1.8
          clang-format --version
          find include src apps tests -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror
